name: Tests
on: push
jobs:
  tests:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install just and cargo-make
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-make
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh
      - name: Build contracts
        run: just build
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check formatting
        run: cargo fmt --all -- --check
      # Each sandbox test starts its own neard. Running them all at once races
      # on unpacking the shared near-sandbox binary and on binding ports, which
      # looks like a flaky test but is contention. Two at a time is stable.
      - name: Run tests
        run: cargo test --workspace --locked -- --test-threads=2
