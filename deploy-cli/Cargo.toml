[package]
name = "cnear-deploy"
version = "1.0.0"
edition = "2018"
publish = false

[lib]
name = "cnear_deploy"
path = "src/lib.rs"

[[bin]]
name = "cnear-deploy"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
near-workspaces = { version = "0.23.0", features = ["unstable"] }
serde_json = "1.0"
tokio = { version = "1.41.0", features = ["rt", "macros"] }
