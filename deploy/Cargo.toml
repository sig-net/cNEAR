[package]
name = "cnear-deploy"
version = "1.0.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
near-api = "=0.8.6"
near-api-types = "=0.8.6"
near-crypto = "0.29.2"
near-jsonrpc-client = "0.16.1"
near-jsonrpc-primitives = "0.29.2"
near-primitives = "0.29.2"
near-token = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.41", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3.14"
